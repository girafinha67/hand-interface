<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>HAND / INTERFACE — Real-Time Hand Tracking</title>
<meta name="theme-color" content="#050507" />
<meta name="description" content="Visão computacional em tempo real: hand tracking, reconhecimento de gestos e interação 3D usando MediaPipe." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #050507;
  --panel-line: rgba(255,255,255,0.55);
  --panel-line-dim: rgba(255,255,255,0.22);
  --accent-magenta: #ff2fd6;
  --accent-violet: #7a3cff;
  --accent-blue: #3ba7ff;
  --accent-cyan: #34f5e0;
  --text-primary: #f5f5fa;
  --text-dim: rgba(245,245,250,0.6);
  --danger: #ff4d4d;
  --ok: #34f5c0;
  --mono: 'Courier New', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text-primary); font-family: var(--sans);
  -webkit-user-select: none; user-select: none;
}
#app { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
#video, #overlay, #glcanvas {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scaleX(-1);
  max-width: none;
}
#video { object-fit: cover; }
#overlay, #glcanvas { pointer-events: none; }
.hud { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.hud-corner { position: absolute; width: 26px; height: 26px; border: 1.5px solid var(--panel-line); opacity: 0.85; }
.hud-corner.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
.hud-corner.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
.hud-corner.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
.hud-corner.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }
.hud-top {
  position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 18px; align-items: center;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim);
  background: rgba(5,5,8,0.35); border: 1px solid var(--panel-line-dim);
  padding: 7px 16px; border-radius: 3px; backdrop-filter: blur(6px); white-space: nowrap;
}
.hud-top .sep { width: 1px; height: 12px; background: var(--panel-line-dim); }
.hud-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--danger); box-shadow: 0 0 6px currentColor; }
.hud-dot.on { background: var(--ok); color: var(--ok); }
.hud-title { position: absolute; top: 18px; left: 18px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--text-dim); line-height: 1.5; }
.hud-title b { color: var(--text-primary); font-weight: 600; }
.hud-gesture {
  position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; color: var(--accent-cyan);
  background: rgba(5,5,8,0.4); border: 1px solid rgba(52,245,224,0.35);
  padding: 6px 14px; border-radius: 3px; opacity: 0; transition: opacity 0.15s ease; text-align: center;
}
.hud-gesture.show { opacity: 1; }
.hud-nohand {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--text-dim);
  opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
}
.hud-nohand.show { opacity: 0.55; }
.controls {
  position: absolute; bottom: 18px; left: 0; right: 0; display: flex; justify-content: center;
  gap: 10px; z-index: 40; pointer-events: auto; padding: 0 12px; flex-wrap: wrap;
}
.ctrl-btn {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; color: var(--text-primary);
  background: rgba(15,15,20,0.55); border: 1px solid var(--panel-line-dim);
  padding: 10px 14px; border-radius: 3px; backdrop-filter: blur(8px); cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
  min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;
}
.ctrl-btn:active { background: rgba(255,255,255,0.12); }
.ctrl-btn.active { border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: 0 0 12px rgba(52,245,224,0.25) inset; }
.overlay-screen {
  position: absolute; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, #0c0c14 0%, #030304 75%);
}
.screen-card { width: min(420px, 88vw); text-align: center; padding: 36px 28px; }
.screen-mark { width: 64px; height: 64px; margin: 0 auto 22px; position: relative; }
.screen-mark svg { width: 100%; height: 100%; }
.screen-title { font-family: var(--mono); font-size: 13px; letter-spacing: 0.22em; color: var(--text-primary); margin-bottom: 8px; text-transform: uppercase; }
.screen-sub { font-family: var(--sans); font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 28px; }
.screen-btn {
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; color: #050507;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  border: none; padding: 14px 36px; border-radius: 3px; cursor: pointer; text-transform: uppercase;
  box-shadow: 0 0 24px rgba(52,245,224,0.25); transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.screen-btn:active { transform: scale(0.97); }
.screen-status { margin-top: 22px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--text-dim); min-height: 16px; }
.screen-error { color: var(--danger); }
.progress-track { width: 100%; height: 2px; background: var(--panel-line-dim); margin-top: 20px; overflow: hidden; border-radius: 2px; }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan)); transition: width 0.25s ease; }
.hidden { display: none !important; }
.perf-badge {
  position: absolute; top: 18px; right: 18px; font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; color: var(--text-dim); background: rgba(5,5,8,0.35);
  border: 1px solid var(--panel-line-dim); padding: 6px 10px; border-radius: 3px; z-index: 30;
}
@media (max-width: 520px) {
  .hud-top { font-size: 9.5px; gap: 10px; padding: 6px 10px; }
  .hud-title { font-size: 9.5px; top: 14px; }
  .ctrl-btn { font-size: 9px; padding: 9px 10px; }
  .perf-badge { font-size: 8.5px; padding: 4px 7px; top: 14px; right: 14px; }
}
@media (orientation: landscape) and (max-height: 480px) {
  .controls { bottom: 8px; }
  .hud-gesture { bottom: 60px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="glcanvas"></canvas>
    <canvas id="overlay"></canvas>
  </div>

  <div class="hud" id="hud">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
    <div class="hud-title">HAND / INTERFACE<br /><b id="stateLabel">INITIALIZING</b></div>
    <div class="perf-badge" id="perfBadge">FPS --</div>
    <div class="hud-top">
      <span><span class="hud-dot" id="camDot"></span>CAM</span>
      <span class="sep"></span>
      <span id="handsLabel">HANDS 0</span>
      <span class="sep"></span>
      <span id="gestureLabel">—</span>
    </div>
    <div class="hud-gesture" id="gestureToast"></div>
    <div class="hud-nohand" id="noHandLabel">NO HAND DETECTED</div>
  </div>

  <div class="controls" id="controls">
    <button class="ctrl-btn" id="btnSwitchCam" title="Trocar câmera">⟲ CAM</button>
    <button class="ctrl-btn" id="btnDebug" title="Modo debug">DEBUG</button>
    <button class="ctrl-btn" id="btnFullscreen" title="Tela cheia">⛶ FULL</button>
    <button class="ctrl-btn" id="btnReset" title="Reiniciar objeto">RESET</button>
  </div>

  <div class="overlay-screen" id="screenStart">
    <div class="screen-card">
      <div class="screen-mark">
        <svg viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="30" stroke="#34f5e0" stroke-width="1" opacity="0.5"/>
          <path d="M22 40V26a3 3 0 016 0v6M28 32v-8a3 3 0 016 0v8M34 32v-6a3 3 0 016 0v10M40 36v-4a3 3 0 016 0v6a10 10 0 01-10 10h-4a10 10 0 01-9-5l-4-7a2.5 2.5 0 014-3l3 4" stroke="#f5f5fa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="screen-title">Hand Interface</div>
      <div class="screen-sub">Visão computacional em tempo real.<br/>Câmera + rastreamento de mãos + gestos.</div>
      <button class="screen-btn" id="btnStart">INICIAR</button>
      <div class="screen-status" id="startStatus"></div>
      <div class="progress-track hidden" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

  <div class="overlay-screen hidden" id="screenError">
    <div class="screen-card">
      <div class="screen-title screen-error">ERRO</div>
      <div class="screen-sub" id="errorMessage">Não foi possível acessar a câmera.</div>
      <button class="screen-btn" id="btnRetry">TENTAR NOVAMENTE</button>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* ======================= CONSTANTES / LANDMARKS ======================= */

var HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

var STATE = {
  INITIALIZING: 'INITIALIZING',
  CAMERA_PERMISSION: 'CAMERA_PERMISSION',
  CAMERA_READY: 'CAMERA_READY',
  LOADING_MODEL: 'LOADING_MODEL',
  TRACKING: 'TRACKING',
  NO_HAND: 'NO_HAND',
  ONE_HAND: 'ONE_HAND',
  TWO_HANDS: 'TWO_HANDS',
  ERROR: 'ERROR'
};

var MP_VERSION = '0.10.14';
var MP_CDN_MIRRORS = [
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VERSION,
  'https://unpkg.com/@mediapipe/tasks-vision@' + MP_VERSION
];
var MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

/* ======================= CAMERA MANAGER ======================= */

function CameraManager(videoEl) {
  this.videoEl = videoEl;
  this.stream = null;
  this.facingMode = 'user';
  this.availableDevices = [];
  this.currentDeviceId = null;
}

CameraManager.prototype.listDevices = async function () {
  try {
    var devices = await navigator.mediaDevices.enumerateDevices();
    this.availableDevices = devices.filter(function (d) { return d.kind === 'videoinput'; });
  } catch (e) {
    this.availableDevices = [];
  }
  return this.availableDevices;
};

CameraManager.prototype._buildConstraintCandidates = function () {
  var facing = this.facingMode;
  function base(w, h) {
    return { audio: false, video: { facingMode: { ideal: facing }, width: { ideal: w }, height: { ideal: h } } };
  }
  return [
    base(1280, 720),
    base(960, 540),
    base(640, 480),
    { audio: false, video: { facingMode: facing } },
    { audio: false, video: true }
  ];
};

CameraManager.prototype._waitForVideoReady = function () {
  var video = this.videoEl;
  return new Promise(function (resolve, reject) {
    function onReady() {
      video.removeEventListener('loadedmetadata', onReady);
      video.play().then(resolve).catch(resolve);
    }
    if (video.readyState >= 1) { onReady(); } else { video.addEventListener('loadedmetadata', onReady); }
    setTimeout(function () { reject(new Error('Timeout ao iniciar vídeo')); }, 8000);
  });
};

CameraManager.prototype._classifyError = function (e) {
  if (!e) return 'UNKNOWN';
  if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') return 'PERMISSION_DENIED';
  if (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError') return 'NO_CAMERA';
  if (e.name === 'NotReadableError' || e.name === 'TrackStartError') return 'CAMERA_IN_USE';
  if (e.name === 'OverconstrainedError') return 'OVERCONSTRAINED';
  return 'UNKNOWN';
};

CameraManager.prototype._describeError = function (e) {
  var type = this._classifyError(e);
  switch (type) {
    case 'PERMISSION_DENIED': return 'Permissão de câmera negada. Autorize o acesso à câmera nas configurações do navegador.';
    case 'NO_CAMERA': return 'Nenhuma câmera foi encontrada neste dispositivo.';
    case 'CAMERA_IN_USE': return 'A câmera está sendo usada por outro aplicativo ou não pôde ser iniciada.';
    case 'OVERCONSTRAINED': return 'Não foi possível encontrar uma configuração de câmera compatível.';
    case 'UNSUPPORTED': return 'Este navegador não suporta acesso à câmera.';
    default: return 'Não foi possível iniciar a câmera. Tente novamente.';
  }
};

CameraManager.prototype.start = async function () {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    var e0 = new Error('getUserMedia não suportado neste navegador.');
    e0.type = 'UNSUPPORTED';
    throw e0;
  }
  this.stop();
  var candidates = this._buildConstraintCandidates();
  var lastError = null;
  for (var i = 0; i < candidates.length; i++) {
    try {
      var stream = await navigator.mediaDevices.getUserMedia(candidates[i]);
      this.stream = stream;
      this.videoEl.srcObject = stream;
      await this._waitForVideoReady();
      await this.listDevices();
      var track = stream.getVideoTracks()[0];
      if (track) {
        var settings = track.getSettings();
        this.currentDeviceId = settings.deviceId || null;
      }
      return this.stream;
    } catch (e) {
      lastError = e;
    }
  }
  var err = new Error(this._describeError(lastError));
  err.type = this._classifyError(lastError);
  err.original = lastError;
  throw err;
};

CameraManager.prototype.switchCamera = function () {
  this.facingMode = this.facingMode === 'user' ? 'environment' : 'user';
  return this.start();
};

CameraManager.prototype.stop = function () {
  if (this.stream) {
    this.stream.getTracks().forEach(function (t) { t.stop(); });
    this.stream = null;
  }
};

CameraManager.prototype.getVideoSize = function () {
  return { width: this.videoEl.videoWidth || 0, height: this.videoEl.videoHeight || 0 };
};

/* ======================= HAND TRACKER (MediaPipe) ======================= */

function withTimeout(promise, timeoutMs, timeoutMessage) {
  return new Promise(function (resolve, reject) {
    var timer = setTimeout(function () {
      reject(new Error(timeoutMessage || 'timeout'));
    }, timeoutMs);
    promise.then(
      function (v) { clearTimeout(timer); resolve(v); },
      function (e) { clearTimeout(timer); reject(e); }
    );
  });
}

// Importa o módulo @mediapipe/tasks-vision via import() dinâmico (forma
// oficialmente recomendada), tentando múltiplos espelhos de CDN em
// sequência antes de desistir. Muito mais confiável do que depender de
// uma <script> clássica expor uma global no window.
async function loadVisionModule() {
  var lastError = null;
  for (var i = 0; i < MP_CDN_MIRRORS.length; i++) {
    var base = MP_CDN_MIRRORS[i];
    try {
      var mod = await withTimeout(import(base), 12000, 'timeout');
      if (mod && mod.FilesetResolver && mod.HandLandmarker) {
        return { module: mod, base: base };
      }
      lastError = new Error('módulo carregado sem os exports esperados');
    } catch (e) {
      lastError = e;
    }
  }
  var e0 = new Error('Não foi possível carregar a biblioteca de tracking (MediaPipe) de nenhum dos servidores tentados. Verifique sua conexão com a internet e tente novamente. Se persistir, seu navegador ou rede pode estar bloqueando scripts externos (ex.: DNS/CDN bloqueado por operadora, bloqueador de anúncios ou modo economia de dados).');
  e0.type = 'LIB_NOT_LOADED';
  e0.original = lastError;
  throw e0;
}

function HandTracker() {
  this.landmarker = null;
  this.ready = false;
}

HandTracker.prototype.init = async function (onProgress) {
  if (onProgress) onProgress(0.05);

  var loaded;
  try {
    loaded = await loadVisionModule();
  } catch (e) {
    throw e; // já vem formatado com type: 'LIB_NOT_LOADED'
  }

  if (onProgress) onProgress(0.1);

  var FilesetResolver = loaded.module.FilesetResolver;
  var HandLandmarker = loaded.module.HandLandmarker;

  var filesetResolver;
  try {
    filesetResolver = await FilesetResolver.forVisionTasks(loaded.base + '/wasm');
  } catch (e) {
    var e1 = new Error('Falha ao carregar o runtime WASM do modelo. Tente recarregar a página.');
    e1.type = 'WASM_LOAD_FAILED';
    e1.original = e;
    throw e1;
  }
  if (onProgress) onProgress(0.55);

  try {
    this.landmarker = await HandLandmarker.createFromOptions(filesetResolver, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
      runningMode: 'VIDEO',
      numHands: 2,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
  } catch (e) {
    // Fallback: tenta CPU delegate caso GPU não esteja disponível/permitido
    try {
      this.landmarker = await HandLandmarker.createFromOptions(filesetResolver, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: 'CPU' },
        runningMode: 'VIDEO',
        numHands: 2,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
    } catch (e2) {
      var e3 = new Error('Falha ao inicializar o modelo de detecção de mãos.');
      e3.type = 'MODEL_INIT_FAILED';
      e3.original = e2;
      throw e3;
    }
  }

  if (onProgress) onProgress(1);
  this.ready = true;
};

HandTracker.prototype.detect = function (videoEl, timestampMs) {
  if (!this.ready || !this.landmarker) return null;
  if (videoEl.readyState < 2) return null;
  try {
    return this.landmarker.detectForVideo(videoEl, timestampMs);
  } catch (e) {
    return null;
  }
};

/* ======================= LANDMARK PROCESSOR (suavização) ======================= */

function LandmarkProcessor(alpha) {
  this.alpha = alpha || 0.55;
  this.smoothedHands = [];
}

LandmarkProcessor.prototype.process = function (rawHandsLandmarks, canvasWidth, canvasHeight) {
  if (!rawHandsLandmarks || rawHandsLandmarks.length === 0) {
    this.smoothedHands = [];
    return [];
  }
  var self = this;
  var results = [];
  rawHandsLandmarks.forEach(function (handLm, handIdx) {
    if (!self.smoothedHands[handIdx]) {
      self.smoothedHands[handIdx] = handLm.map(function (p) { return { x: p.x, y: p.y, z: p.z || 0 }; });
    }
    var smoothed = self.smoothedHands[handIdx];
    var points = handLm.map(function (p, i) {
      var prev = smoothed[i] || { x: p.x, y: p.y, z: p.z || 0 };
      var sx = prev.x + (p.x - prev.x) * self.alpha;
      var sy = prev.y + (p.y - prev.y) * self.alpha;
      var sz = prev.z + ((p.z || 0) - prev.z) * self.alpha;
      smoothed[i] = { x: sx, y: sy, z: sz };
      return { normX: sx, normY: sy, normZ: sz, x: sx * canvasWidth, y: sy * canvasHeight, z: sz };
    });
    results.push({ points: points });
  });
  self.smoothedHands.length = rawHandsLandmarks.length;
  return results;
};

/* ======================= GESTURE RECOGNIZER ======================= */

var FINGER_TIPS = { thumb: 4, index: 8, middle: 12, ring: 16, pinky: 20 };
var FINGER_MCPS = { thumb: 2, index: 5, middle: 9, ring: 13, pinky: 17 };
var FINGER_PIPS = { index: 6, middle: 10, ring: 14, pinky: 18 };

function dist(a, b) {
  var dx = a.normX - b.normX, dy = a.normY - b.normY, dz = (a.normZ || 0) - (b.normZ || 0);
  return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function isFingerExtended(points, tipIdx, pipIdx) {
  var tip = points[tipIdx], pip = points[pipIdx], wrist = points[0];
  var dTip = dist(tip, wrist), dPip = dist(pip, wrist);
  return dTip > dPip * 1.08;
}

function isThumbExtended(points) {
  var tip = points[FINGER_TIPS.thumb], mcp = points[FINGER_MCPS.thumb];
  var wrist = points[0], indexMcp = points[5];
  var dTip = dist(tip, indexMcp), dMcp = dist(mcp, indexMcp);
  return dTip > dMcp * 1.15 && dist(tip, wrist) > dist(mcp, wrist) * 1.05;
}

function GestureRecognizer() {
  this.state = {};
  this.PINCH_THRESHOLD_ON = 0.055;
  this.PINCH_THRESHOLD_OFF = 0.075;
  this._prevTwoHandDist = undefined;
}

GestureRecognizer.prototype.recognize = function (hands) {
  var self = this;
  var perHand = hands.map(function (hand, idx) { return self._recognizeHand(hand.points, idx); });
  var twoHand = null;
  if (hands.length === 2) twoHand = this._recognizeTwoHands(hands[0].points, hands[1].points);
  return { hands: perHand, twoHand: twoHand };
};

GestureRecognizer.prototype._recognizeHand = function (points, handIdx) {
  var thumbTip = points[FINGER_TIPS.thumb];
  var indexTip = points[FINGER_TIPS.index];
  var pinchDist = dist(thumbTip, indexTip);

  if (!this.state[handIdx]) this.state[handIdx] = { pinching: false };
  var st = this.state[handIdx];

  var pinchEvent = null;
  var wasPinching = st.pinching;
  if (!wasPinching && pinchDist < this.PINCH_THRESHOLD_ON) {
    st.pinching = true; pinchEvent = 'PINCH_START';
  } else if (wasPinching && pinchDist > this.PINCH_THRESHOLD_OFF) {
    st.pinching = false; pinchEvent = 'PINCH_END';
  } else if (st.pinching) {
    pinchEvent = 'PINCHING';
  }

  var indexExt = isFingerExtended(points, FINGER_TIPS.index, FINGER_PIPS.index);
  var middleExt = isFingerExtended(points, FINGER_TIPS.middle, FINGER_PIPS.middle);
  var ringExt = isFingerExtended(points, FINGER_TIPS.ring, FINGER_PIPS.ring);
  var pinkyExt = isFingerExtended(points, FINGER_TIPS.pinky, FINGER_PIPS.pinky);
  var thumbExt = isThumbExtended(points);

  var extendedCount = [indexExt, middleExt, ringExt, pinkyExt].filter(Boolean).length;
  var shape = 'NONE';
  if (extendedCount >= 3) shape = 'OPEN_HAND';
  else if (extendedCount === 0 && !thumbExt) shape = 'FIST';
  else if (indexExt && !middleExt && !ringExt && !pinkyExt) shape = 'POINT';

  var midTip = {
    normX: (thumbTip.normX + indexTip.normX) / 2,
    normY: (thumbTip.normY + indexTip.normY) / 2,
    x: (thumbTip.x + indexTip.x) / 2,
    y: (thumbTip.y + indexTip.y) / 2
  };

  return {
    handIdx: handIdx, pinchDist: pinchDist, pinching: st.pinching, pinchEvent: pinchEvent,
    shape: shape, indexTip: indexTip, thumbTip: thumbTip, pinchMidpoint: midTip, wrist: points[0],
    fingersExtended: { thumb: thumbExt, index: indexExt, middle: middleExt, ring: ringExt, pinky: pinkyExt }
  };
};

GestureRecognizer.prototype._recognizeTwoHands = function (pointsA, pointsB) {
  var wristA = pointsA[0], wristB = pointsB[0];
  var distance = dist(wristA, wristB);
  var center = {
    normX: (wristA.normX + wristB.normX) / 2, normY: (wristA.normY + wristB.normY) / 2,
    x: (wristA.x + wristB.x) / 2, y: (wristA.y + wristB.y) / 2
  };
  var angle = Math.atan2(wristB.normY - wristA.normY, wristB.normX - wristA.normX);
  if (this._prevTwoHandDist === undefined) this._prevTwoHandDist = distance;
  var distanceDelta = distance - this._prevTwoHandDist;
  this._prevTwoHandDist = distance;
  return { distance: distance, center: center, angle: angle, distanceDelta: distanceDelta };
};

/* ======================= OBJECT CONTROLLER ======================= */

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function clamp01(v) { return clamp(v, 0, 1); }

function ObjectController() { this.reset(); }

ObjectController.prototype.reset = function () {
  this.position = { x: 0.5, y: 0.5 };
  this.targetPosition = { x: 0.5, y: 0.5 };
  this.scale = 1; this.targetScale = 1;
  this.rotation = 0; this.targetRotation = 0;
  this.selected = false; this.selectedByHand = null;
  this.grabOffset = null;
  this.baseScaleAtGestureStart = 1;
  this.baseDistanceAtGestureStart = null;
  this.baseRotationAtGestureStart = 0;
  this.baseAngleAtGestureStart = null;
  this.pulse = 0;
};

ObjectController.prototype.selectByHand = function (handIdx, point) {
  this.selected = true; this.selectedByHand = handIdx;
  this.grabOffset = { x: this.position.x - point.normX, y: this.position.y - point.normY };
};

ObjectController.prototype.moveTo = function (point) {
  if (!this.grabOffset) this.grabOffset = { x: 0, y: 0 };
  this.targetPosition.x = clamp01(point.normX + this.grabOffset.x);
  this.targetPosition.y = clamp01(point.normY + this.grabOffset.y);
};

ObjectController.prototype.release = function (handIdx) {
  if (this.selectedByHand === handIdx) {
    this.selected = false; this.selectedByHand = null; this.grabOffset = null;
  }
};

ObjectController.prototype.startTwoHandGesture = function (distance, angle) {
  this.baseDistanceAtGestureStart = distance;
  this.baseScaleAtGestureStart = this.targetScale;
  this.baseAngleAtGestureStart = angle;
  this.baseRotationAtGestureStart = this.targetRotation;
};

ObjectController.prototype.updateTwoHandGesture = function (distance, angle, center) {
  if (this.baseDistanceAtGestureStart) {
    var ratio = distance / this.baseDistanceAtGestureStart;
    this.targetScale = clamp(this.baseScaleAtGestureStart * ratio, 0.3, 3.2);
  }
  if (this.baseAngleAtGestureStart !== null) {
    var deltaAngle = angle - this.baseAngleAtGestureStart;
    this.targetRotation = this.baseRotationAtGestureStart + deltaAngle;
  }
  if (center) {
    this.targetPosition.x = clamp01(center.normX);
    this.targetPosition.y = clamp01(center.normY);
  }
};

ObjectController.prototype.endTwoHandGesture = function () {
  this.baseDistanceAtGestureStart = null; this.baseAngleAtGestureStart = null;
};

ObjectController.prototype.triggerPulse = function () { this.pulse = 1; };

ObjectController.prototype.update = function (dt) {
  var smooth = 1 - Math.pow(0.001, dt);
  this.position.x += (this.targetPosition.x - this.position.x) * smooth;
  this.position.y += (this.targetPosition.y - this.position.y) * smooth;
  this.scale += (this.targetScale - this.scale) * smooth;
  this.rotation += (this.targetRotation - this.rotation) * smooth;
  if (this.pulse > 0) this.pulse = Math.max(0, this.pulse - dt * 2.2);
};

/* ======================= INTERACTION MANAGER ======================= */

var OBJECT_HIT_RADIUS_NORM = 0.22;
function dist2D(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

function InteractionManager(objectController) {
  this.obj = objectController;
  this.twoHandActive = false;
  this.lastEvents = [];
}

InteractionManager.prototype.update = function (gestureResult) {
  this.lastEvents = [];
  var hands = gestureResult.hands, twoHand = gestureResult.twoHand;
  var self = this;

  if (hands.length === 2 && twoHand) {
    if (!this.twoHandActive) {
      this.twoHandActive = true;
      this.obj.startTwoHandGesture(twoHand.distance, twoHand.angle);
      this.obj.release(0); this.obj.release(1);
      this.lastEvents.push('TWO_HAND_START');
    }
    this.obj.updateTwoHandGesture(twoHand.distance, twoHand.angle, twoHand.center);
    return this.lastEvents;
  } else if (this.twoHandActive) {
    this.twoHandActive = false;
    this.obj.endTwoHandGesture();
    this.lastEvents.push('TWO_HAND_END');
  }

  hands.forEach(function (hand) {
    var p = hand.pinchMidpoint;
    if (hand.pinchEvent === 'PINCH_START') {
      var d = dist2D(p.normX, p.normY, self.obj.position.x, self.obj.position.y);
      if (d < OBJECT_HIT_RADIUS_NORM) {
        self.obj.selectByHand(hand.handIdx, p);
        self.obj.triggerPulse();
        self.lastEvents.push('OBJECT_SELECTED');
      }
    } else if (hand.pinchEvent === 'PINCHING' && self.obj.selectedByHand === hand.handIdx) {
      self.obj.moveTo(p);
    } else if (hand.pinchEvent === 'PINCH_END' && self.obj.selectedByHand === hand.handIdx) {
      self.obj.release(hand.handIdx);
      self.lastEvents.push('OBJECT_RELEASED');
    }
    if (hand.shape === 'OPEN_HAND' && hand.pinchEvent === null) self.lastEvents.push('OPEN_HAND');
    if (hand.shape === 'FIST') self.lastEvents.push('FIST');
    if (hand.shape === 'POINT') self.lastEvents.push('POINT');
  });

  return this.lastEvents;
};

/* ======================= CANVAS RENDERER (overlay 2D) ======================= */

var COLORS = {
  lineDim: 'rgba(255,255,255,0.35)',
  pointFill: 'rgba(255,255,255,0.9)',
  box: 'rgba(255,255,255,0.7)',
  text: 'rgba(255,255,255,0.92)',
  cyan: '#34f5e0',
  magenta: '#ff2fd6'
};

function CanvasRenderer(canvas) {
  this.canvas = canvas;
  this.ctx = canvas.getContext('2d');
}

CanvasRenderer.prototype.resize = function (width, height, dpr) {
  this.canvas.width = width * dpr;
  this.canvas.height = height * dpr;
  this.canvas.style.width = width + 'px';
  this.canvas.style.height = height + 'px';
  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  this.width = width; this.height = height;
};

CanvasRenderer.prototype.clear = function () { this.ctx.clearRect(0, 0, this.width, this.height); };

CanvasRenderer.prototype._drawMirroredLabel = function (text, x, y, color) {
  var ctx = this.ctx;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(-1, 1);
  ctx.font = '11px "Courier New", monospace';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  var w = ctx.measureText(text).width;
  ctx.fillRect(-w - 4, -2, w + 8, 14);
  ctx.fillStyle = color || COLORS.text;
  ctx.textAlign = 'right';
  ctx.fillText(text, -4, 0);
  ctx.restore();
};

CanvasRenderer.prototype._drawDebugInfo = function (hand, idx, gesture, handednessLabel) {
  var wrist = hand.points[0];
  var indexTip = hand.points[8];
  var label = 'x:' + Math.round(indexTip.normX * 1000) + ' y:' + Math.round(indexTip.normY * 1000) +
    (indexTip.normZ !== undefined ? ' z:' + indexTip.normZ.toFixed(2) : '');
  this._drawMirroredLabel(label, indexTip.x, indexTip.y - 22, COLORS.text);
  var handLabel = handednessLabel || (idx === 0 ? 'HAND_0' : 'HAND_1');
  this._drawMirroredLabel(handLabel, wrist.x, wrist.y + 14, COLORS.text);
  if (gesture && gesture.shape !== 'NONE') {
    this._drawMirroredLabel(gesture.shape, wrist.x, wrist.y + 28, COLORS.magenta);
  }
};

CanvasRenderer.prototype.drawHands = function (hands, opts) {
  opts = opts || {};
  var ctx = this.ctx;
  var debug = !!opts.debug;
  var gestureByHand = opts.gestureByHand || [];
  var handednessLabels = opts.handednessLabels || [];
  var self = this;

  hands.forEach(function (hand, idx) {
    var pts = hand.points;

    ctx.save();
    ctx.strokeStyle = COLORS.lineDim;
    ctx.lineWidth = 1;
    HAND_CONNECTIONS.forEach(function (pair) {
      ctx.beginPath();
      ctx.moveTo(pts[pair[0]].x, pts[pair[0]].y);
      ctx.lineTo(pts[pair[1]].x, pts[pair[1]].y);
      ctx.stroke();
    });
    ctx.restore();

    pts.forEach(function (p, i) {
      var isTip = [4, 8, 12, 16, 20].indexOf(i) !== -1;
      var r = isTip ? 3.4 : 2.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = isTip ? COLORS.cyan : COLORS.pointFill;
      ctx.fill();
      if (debug && isTip) {
        ctx.strokeStyle = COLORS.box;
        ctx.lineWidth = 1;
        ctx.strokeRect(p.x - 9, p.y - 9, 18, 18);
      }
    });

    if (debug) self._drawDebugInfo(hand, idx, gestureByHand[idx], handednessLabels[idx]);

    var thumb = pts[4], index = pts[8];
    ctx.beginPath();
    ctx.moveTo(thumb.x, thumb.y);
    ctx.lineTo(index.x, index.y);
    ctx.strokeStyle = 'rgba(52,245,224,0.55)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  });

  if (hands.length === 2 && debug) {
    var wristA = hands[0].points[0], wristB = hands[1].points[0];
    ctx.beginPath();
    ctx.setLineDash([6, 5]);
    ctx.moveTo(wristA.x, wristA.y);
    ctx.lineTo(wristB.x, wristB.y);
    ctx.strokeStyle = COLORS.lineDim;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
  }
};

/* ======================= OBJECT RENDERER (Three.js) ======================= */

function ObjectRenderer(canvas) {
  this.canvas = canvas;
  this.renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true, premultipliedAlpha: false });
  this.renderer.setClearColor(0x000000, 0);
  this.scene = new THREE.Scene();
  this.camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  this.camera.position.set(0, 0, 6);
  this._buildObject();
  this._buildLights();
  this.time = 0;
}

ObjectRenderer.prototype._buildLights = function () {
  var ambient = new THREE.AmbientLight(0xffffff, 0.5);
  this.scene.add(ambient);
  var point1 = new THREE.PointLight(0xff2fd6, 2.2, 20);
  point1.position.set(3, 2, 4);
  this.scene.add(point1);
  var point2 = new THREE.PointLight(0x3ba7ff, 2.0, 20);
  point2.position.set(-3, -2, 3);
  this.scene.add(point2);
};

ObjectRenderer.prototype._buildObject = function () {
  this.group = new THREE.Group();

  var coreGeo = new THREE.OctahedronGeometry(1.15, 0);
  var coreMat = new THREE.MeshPhongMaterial({
    color: 0xcf6bff, emissive: 0x8a2be2, emissiveIntensity: 0.55,
    shininess: 80, transparent: true, opacity: 0.92
  });
  this.core = new THREE.Mesh(coreGeo, coreMat);
  this.group.add(this.core);

  var wireGeo = new THREE.OctahedronGeometry(1.32, 0);
  var wireMat = new THREE.MeshBasicMaterial({ color: 0x34f5e0, wireframe: true, transparent: true, opacity: 0.55 });
  this.wire = new THREE.Mesh(wireGeo, wireMat);
  this.group.add(this.wire);

  this.shards = new THREE.Group();
  var shardMat = new THREE.MeshBasicMaterial({ color: 0xff2fd6, transparent: true, opacity: 0.75, side: THREE.DoubleSide });
  for (var i = 0; i < 3; i++) {
    var shardGeo = new THREE.ConeGeometry(0.22, 1.5, 3);
    var shard = new THREE.Mesh(shardGeo, shardMat);
    var angle = (i / 3) * Math.PI * 2;
    shard.position.set(Math.cos(angle) * 1.9, Math.sin(angle) * 0.3, Math.sin(angle) * 1.9);
    shard.rotation.z = angle;
    this.shards.add(shard);
  }
  this.group.add(this.shards);

  this.scene.add(this.group);
};

ObjectRenderer.prototype.resize = function (width, height, dpr) {
  this.renderer.setPixelRatio(dpr);
  this.renderer.setSize(width, height, false);
  this.camera.aspect = width / height;
  this.camera.updateProjectionMatrix();
  this.width = width; this.height = height;
};

ObjectRenderer.prototype.render = function (obj, dt) {
  this.time += dt;
  var ndcX = (obj.position.x - 0.5) * 2;
  var ndcY = -(obj.position.y - 0.5) * 2;
  var depth = 6;
  var vFOV = (this.camera.fov * Math.PI) / 180;
  var visibleHeight = 2 * Math.tan(vFOV / 2) * depth;
  var visibleWidth = visibleHeight * this.camera.aspect;

  this.group.position.x = ndcX * (visibleWidth / 2);
  this.group.position.y = ndcY * (visibleHeight / 2);

  var s = obj.scale * (1 + obj.pulse * 0.35);
  this.group.scale.setScalar(s);
  this.group.rotation.y = obj.rotation;
  this.group.rotation.x = Math.sin(this.time * 0.4) * 0.15;

  this.core.rotation.y += dt * 0.3;
  this.wire.rotation.y -= dt * 0.22;
  this.shards.rotation.z += dt * 0.5;

  var pulseGlow = 0.55 + obj.pulse * 0.6;
  this.core.material.emissiveIntensity = pulseGlow;
  var highlight = obj.selected ? 1.0 : 0.75;
  this.wire.material.opacity = 0.4 + highlight * 0.25;

  this.renderer.render(this.scene, this.camera);
};

/* ======================= EFFECTS RENDERER (partículas) ======================= */

function EffectsRenderer(ctx) {
  this.ctx = ctx;
  this.particles = [];
  this.maxParticles = 60;
  this.quality = 1;
}

EffectsRenderer.prototype.setQuality = function (q) { this.quality = q; this.maxParticles = Math.round(60 * q); };

EffectsRenderer.prototype.emitAt = function (x, y, color, count) {
  color = color || '255,255,255'; count = count || 6;
  var n = Math.round(count * this.quality);
  for (var i = 0; i < n; i++) {
    if (this.particles.length >= this.maxParticles) break;
    var angle = Math.random() * Math.PI * 2;
    var speed = 0.6 + Math.random() * 1.6;
    this.particles.push({
      x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, decay: 1.1 + Math.random() * 0.8, size: 1.2 + Math.random() * 1.8, color: color
    });
  }
};

EffectsRenderer.prototype.update = function (dt) {
  for (var i = this.particles.length - 1; i >= 0; i--) {
    var p = this.particles[i];
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
    p.life -= p.decay * dt;
    if (p.life <= 0) this.particles.splice(i, 1);
  }
};

EffectsRenderer.prototype.draw = function () {
  var ctx = this.ctx;
  this.particles.forEach(function (p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + p.color + ',' + Math.max(0, p.life) + ')';
    ctx.fill();
  });
};

/* ======================= HUD / DEBUG PANEL (DOM) ======================= */

function HUD() {
  this.el = {
    stateLabel: document.getElementById('stateLabel'),
    camDot: document.getElementById('camDot'),
    handsLabel: document.getElementById('handsLabel'),
    gestureLabel: document.getElementById('gestureLabel'),
    gestureToast: document.getElementById('gestureToast'),
    noHandLabel: document.getElementById('noHandLabel'),
    perfBadge: document.getElementById('perfBadge')
  };
  this._toastTimer = null;
}
HUD.prototype.setState = function (s) { this.el.stateLabel.textContent = s; };
HUD.prototype.setCameraOnline = function (on) { this.el.camDot.classList.toggle('on', !!on); };
HUD.prototype.setHandsCount = function (n) {
  this.el.handsLabel.textContent = 'HANDS ' + n;
  this.el.noHandLabel.classList.toggle('show', n === 0);
};
HUD.prototype.setGestureLabel = function (text) { this.el.gestureLabel.textContent = text || '—'; };
HUD.prototype.showGestureToast = function (text) {
  var self = this;
  this.el.gestureToast.textContent = text;
  this.el.gestureToast.classList.add('show');
  clearTimeout(this._toastTimer);
  this._toastTimer = setTimeout(function () { self.el.gestureToast.classList.remove('show'); }, 900);
};
HUD.prototype.setFps = function (fps) { this.el.perfBadge.textContent = 'FPS ' + fps; };

function DebugPanel(btn) {
  this.btn = btn;
  this.enabled = false;
  var self = this;
  this.btn.addEventListener('click', function () { self.toggle(); });
}
DebugPanel.prototype.toggle = function () {
  this.enabled = !this.enabled;
  this.btn.classList.toggle('active', this.enabled);
  return this.enabled;
};

/* ======================= APP (orquestrador principal) ======================= */

function App() {
  this.videoEl = document.getElementById('video');
  this.overlayCanvas = document.getElementById('overlay');
  this.glCanvas = document.getElementById('glcanvas');

  this.camera = new CameraManager(this.videoEl);
  this.tracker = new HandTracker();
  this.processor = new LandmarkProcessor(0.55);
  this.gestures = new GestureRecognizer();
  this.objectCtrl = new ObjectController();
  this.interaction = new InteractionManager(this.objectCtrl);

  this.canvasRenderer = new CanvasRenderer(this.overlayCanvas);
  this.objectRenderer = null; // criado em startFlow(), após garantir que THREE carregou
  this.effects = new EffectsRenderer(this.overlayCanvas.getContext('2d'));

  this.hud = new HUD();
  this.debugPanel = new DebugPanel(document.getElementById('btnDebug'));

  this.state = STATE.INITIALIZING;
  this.running = false;
  this.lastFrameTime = performance.now();

  this.fpsHistory = [];
  this.fps = 0;
  this._displaySize = null;

  this._bindUI();
  this._bindResize();
}

App.prototype._bindUI = function () {
  var self = this;
  document.getElementById('btnStart').addEventListener('click', function () { self.startFlow(); });
  document.getElementById('btnRetry').addEventListener('click', function () { self.startFlow(); });
  document.getElementById('btnSwitchCam').addEventListener('click', function () { self.switchCamera(); });
  document.getElementById('btnFullscreen').addEventListener('click', function () { self.toggleFullscreen(); });
  document.getElementById('btnReset').addEventListener('click', function () { self.objectCtrl.reset(); });
};

App.prototype._bindResize = function () {
  var self = this;
  window.addEventListener('resize', function () { self._resizeCanvases(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { self._resizeCanvases(); }, 250); });
};

App.prototype._resizeCanvases = function () {
  var stage = document.getElementById('stage');
  var rect = stage.getBoundingClientRect();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  var vsize = this.camera.getVideoSize();
  var vw = vsize.width || rect.width;
  var vh = vsize.height || rect.height;
  var videoAspect = vw / vh || 16 / 9;
  var stageAspect = rect.width / rect.height;

  var displayW, displayH;
  if (videoAspect > stageAspect) {
    displayH = rect.height;
    displayW = displayH * videoAspect;
  } else {
    displayW = rect.width;
    displayH = displayW / videoAspect;
  }

  this.videoEl.style.width = displayW + 'px';
  this.videoEl.style.height = displayH + 'px';
  [this.overlayCanvas, this.glCanvas].forEach(function (c) {
    c.style.width = displayW + 'px';
    c.style.height = displayH + 'px';
  });

  this.canvasRenderer.resize(displayW, displayH, dpr);
  if (this.objectRenderer) this.objectRenderer.resize(displayW, displayH, dpr);
  this._displaySize = { width: displayW, height: displayH };
};

App.prototype.startFlow = async function () {
  this._showScreen('start');
  this._setStatus('');
  this._setState(STATE.CAMERA_PERMISSION);

  var self = this;
  var timedOut = false;
  var safetyTimer = setTimeout(function () {
    timedOut = true;
    self._handleFatalError(new Error('Tempo esgotado ao iniciar. Verifique sua conexão com a internet (o modelo é baixado na primeira vez) e tente novamente.'));
  }, 40000);

  try {
    this._setStatus('SOLICITANDO ACESSO À CÂMERA...');
    await this.camera.start();
    if (timedOut) return;
    this.hud.setCameraOnline(true);
    this._setState(STATE.CAMERA_READY);
    this._resizeCanvases();

    this._setStatus('CARREGANDO MODELO DE TRACKING...');
    this._showProgress(true);
    this._setState(STATE.LOADING_MODEL);
    await this.tracker.init(function (p) { self._setProgress(p); });
    if (timedOut) return;

    if (!this.objectRenderer) {
      this._setStatus('CARREGANDO MOTOR 3D...');
      try {
        await waitForGlobal(function () { return !!window.THREE; }, 15000);
      } catch (e) {
        throw new Error('Não foi possível carregar o motor 3D (Three.js). Verifique sua conexão com a internet e tente novamente.');
      }
      if (timedOut) return;
      this.objectRenderer = new ObjectRenderer(this.glCanvas);
      this._resizeCanvases();
    }

    clearTimeout(safetyTimer);
    this._showProgress(false);
    this._hideAllScreens();
    this._setState(STATE.TRACKING);
    this._startLoop();
  } catch (err) {
    clearTimeout(safetyTimer);
    if (!timedOut) this._handleFatalError(err);
  }
};

App.prototype.switchCamera = async function () {
  try {
    this.hud.setCameraOnline(false);
    await this.camera.switchCamera();
    this.hud.setCameraOnline(true);
    this._resizeCanvases();
  } catch (err) {
    this._handleFatalError(err);
  }
};

App.prototype.toggleFullscreen = function () {
  var el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(function () {});
  }
};

App.prototype._handleFatalError = function (err) {
  this._setState(STATE.ERROR);
  this._stopLoop();
  var msg = err && err.message ? err.message : 'Ocorreu um erro inesperado.';
  document.getElementById('errorMessage').textContent = msg;
  this._showScreen('error');
};

App.prototype._showScreen = function (name) {
  document.getElementById('screenStart').classList.toggle('hidden', name !== 'start');
  document.getElementById('screenError').classList.toggle('hidden', name !== 'error');
};
App.prototype._hideAllScreens = function () {
  document.getElementById('screenStart').classList.add('hidden');
  document.getElementById('screenError').classList.add('hidden');
};
App.prototype._setStatus = function (text) { document.getElementById('startStatus').textContent = text; };
App.prototype._showProgress = function (show) { document.getElementById('progressTrack').classList.toggle('hidden', !show); };
App.prototype._setProgress = function (p) { document.getElementById('progressFill').style.width = Math.round(p * 100) + '%'; };
App.prototype._setState = function (s) { this.state = s; this.hud.setState(s); };

App.prototype._startLoop = function () {
  if (this.running) return;
  this.running = true;
  this.lastFrameTime = performance.now();
  requestAnimationFrame(this._loop.bind(this));
};
App.prototype._stopLoop = function () { this.running = false; };

App.prototype._loop = function (now) {
  if (!this.running) return;
  var dt = Math.min((now - this.lastFrameTime) / 1000, 0.1);
  this.lastFrameTime = now;

  this._updateFps(dt);
  this._adaptQuality();

  var result = this.tracker.detect(this.videoEl, now);
  var rawLandmarks = (result && result.landmarks) ? result.landmarks : [];
  var handednessLabels = ((result && result.handedness) ? result.handedness : []).map(function (h) {
    return h[0] ? h[0].categoryName : '';
  });

  var w = this._displaySize ? this._displaySize.width : this.overlayCanvas.width;
  var h = this._displaySize ? this._displaySize.height : this.overlayCanvas.height;

  var hands = this.processor.process(rawLandmarks, w, h);
  var gestureResult = this.gestures.recognize(hands);
  var events = this.interaction.update(gestureResult);

  this._reactToEvents(events, hands, gestureResult);
  this._updateStateForHandCount(hands.length);

  this.objectCtrl.update(dt);
  this.effects.update(dt);

  this.canvasRenderer.clear();
  this.canvasRenderer.drawHands(hands, {
    debug: this.debugPanel.enabled,
    gestureByHand: gestureResult.hands,
    handednessLabels: handednessLabels
  });
  this.effects.draw();
  if (this.objectRenderer) this.objectRenderer.render(this.objectCtrl, dt);

  requestAnimationFrame(this._loop.bind(this));
};

App.prototype._reactToEvents = function (events, hands, gestureResult) {
  var self = this;
  var uniq = events.filter(function (v, i) { return events.indexOf(v) === i; });
  uniq.forEach(function (evt) {
    if (evt === 'OBJECT_SELECTED') { self.hud.showGestureToast('PINCH · SELECTED'); self._emitParticlesAtObject(); }
    else if (evt === 'OBJECT_RELEASED') self.hud.showGestureToast('PINCH · RELEASED');
    else if (evt === 'OPEN_HAND') self.hud.showGestureToast('OPEN HAND');
    else if (evt === 'FIST') self.hud.showGestureToast('FIST');
    else if (evt === 'POINT') self.hud.showGestureToast('POINT');
    else if (evt === 'TWO_HAND_START') self.hud.showGestureToast('TWO HANDS · SCALE/ROTATE');
  });

  var label = '—';
  if (gestureResult.twoHand) {
    label = 'TWO_HANDS';
  } else if (gestureResult.hands.length > 0) {
    var h0 = gestureResult.hands[0];
    if (h0.pinching) label = 'PINCH';
    else if (h0.shape !== 'NONE') label = h0.shape;
  }
  this.hud.setGestureLabel(label);
};

App.prototype._emitParticlesAtObject = function () {
  if (!this._displaySize) return;
  var x = this.objectCtrl.position.x * this._displaySize.width;
  var y = this.objectCtrl.position.y * this._displaySize.height;
  this.effects.emitAt(x, y, '255,47,214', 10);
};

App.prototype._updateStateForHandCount = function (n) {
  this.hud.setHandsCount(n);
  if (n === 0) this._setState(STATE.NO_HAND);
  else if (n === 1) this._setState(STATE.ONE_HAND);
  else this._setState(STATE.TWO_HANDS);
};

App.prototype._updateFps = function (dt) {
  var instFps = dt > 0 ? 1 / dt : 60;
  this.fpsHistory.push(instFps);
  if (this.fpsHistory.length > 30) this.fpsHistory.shift();
  var sum = this.fpsHistory.reduce(function (a, b) { return a + b; }, 0);
  this.fps = Math.round(sum / this.fpsHistory.length);
  this.hud.setFps(this.fps);
};

App.prototype._adaptQuality = function () {
  var targetQuality = 1;
  if (this.fps < 18) targetQuality = 0.3;
  else if (this.fps < 26) targetQuality = 0.6;
  this.effects.setQuality(targetQuality);
};

/* ======================= PWA: registro do Service Worker ======================= */

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    // "Kill switch": remove qualquer Service Worker e cache antigos que
    // possam ter ficado presos de uma versão anterior do app, antes de
    // registrar o atual. Isso evita ficar travado numa versão velha
    // depois de um deploy, independentemente do que estava rodando antes.
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }),
      ('caches' in window)
        ? caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          })
        : Promise.resolve()
    ]).catch(function () {}).then(function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {
        // registro do SW é opcional para o funcionamento do app; falha aqui não é fatal
      });
    });
  });
}

/* ======================= BOOT ======================= */

window.addEventListener('DOMContentLoaded', function () {
  var app = new App();
  window.__handApp = app;

  window.addEventListener('error', function (ev) {
    if (app.state !== STATE.TRACKING && app.state !== STATE.NO_HAND &&
        app.state !== STATE.ONE_HAND && app.state !== STATE.TWO_HANDS) {
      app._handleFatalError(new Error('Erro ao carregar: ' + (ev.message || 'erro desconhecido') + '. Verifique sua conexão e tente novamente.'));
    }
  });
  window.addEventListener('unhandledrejection', function (ev) {
    if (app.state !== STATE.TRACKING && app.state !== STATE.NO_HAND &&
        app.state !== STATE.ONE_HAND && app.state !== STATE.TWO_HANDS) {
      var reason = ev.reason && ev.reason.message ? ev.reason.message : 'Falha ao inicializar.';
      app._handleFatalError(new Error(reason));
    }
  });
});

})();
</script>
